name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: The tag is a version, and the package carries it
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$TAG' is not a release tag. Tag releases v<major>.<minor>.<patch>." >&2
            exit 1
          fi
          pip install packaging
          python - <<'EOF'
          import os, sys, tomllib
          from packaging.version import Version
          tag = os.environ["TAG"][1:]
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if Version(tag) != Version(version):
              sys.exit(f"::error::the tag says {tag}, pyproject.toml says {version}")
          EOF

      - name: Test
        run: |
          pip install -e '.[test]'
          python -m pytest -q tests

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/python-ferryclient/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github:
    needs: pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          cat > notes.md <<EOF
          The \`openstack backup\` client for Ferry ${version}.

          \`\`\`sh
          pip install python-ferryclient==${version}
          \`\`\`

          What changed in Ferry ${version}: https://github.com/osie/ferry-backup/releases/tag/${TAG}
          EOF
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag
