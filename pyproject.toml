[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-ferryclient"
version = "0.17.0"
description = "OpenStackClient plugin for Ferry backup, recovery and DR"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{name = "The Ferry Authors"}]
keywords = ["openstack", "backup", "disaster-recovery", "openstackclient", "ceph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: OpenStack",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    "keystoneauth1>=4.0.0",
    "osc-lib>=2.3.0",
    "cliff>=3.5.0",
]

[project.optional-dependencies]
test = ["pytest", "requests-mock"]

[project.urls]
Homepage = "https://osie.io/docs/ferry/"
Documentation = "https://osie.io/docs/ferry/cli-reference/"
Source = "https://github.com/osie/python-ferryclient"
Issues = "https://github.com/osie/python-ferryclient/issues"
Deployment = "https://github.com/osie/ferry-backup"

# The command noun is `backup` and the catalog service type is `backup`, so
# API_NAME, this entry point group and `openstack endpoint list` all agree.
[project.entry-points."openstack.cli.extension"]
backup = "ferryclient.osc.plugin"

[project.entry-points."openstack.backup.v1"]
backup_plan_list = "ferryclient.osc.v1.plan:ListPlan"
backup_plan_show = "ferryclient.osc.v1.plan:ShowPlan"
backup_plan_create = "ferryclient.osc.v1.plan:CreatePlan"
backup_plan_set = "ferryclient.osc.v1.plan:SetPlan"
backup_plan_delete = "ferryclient.osc.v1.plan:DeletePlan"
backup_plan_restore = "ferryclient.osc.v1.plan:RestorePlan"
backup_plan_refusal_list = "ferryclient.osc.v1.plan:ListPlanRefusal"
backup_plan_missed_tick_list = "ferryclient.osc.v1.plan:ListPlanMissedTick"
backup_plan_sla_show = "ferryclient.osc.v1.plan:ShowPlanSLA"

backup_policy_list = "ferryclient.osc.v1.policy:ListPolicy"
backup_policy_show = "ferryclient.osc.v1.policy:ShowPolicy"
backup_policy_create = "ferryclient.osc.v1.policy:CreatePolicy"
backup_policy_set = "ferryclient.osc.v1.policy:SetPolicy"
backup_policy_assign = "ferryclient.osc.v1.policy:AssignPolicy"
backup_policy_deprecate = "ferryclient.osc.v1.policy:DeprecatePolicy"
